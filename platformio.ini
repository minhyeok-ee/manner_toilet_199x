[env:portenta_h7_m7]
platform = ststm32
board = portenta_h7_m7
framework = arduino

upload_protocol = dfu
monitor_speed = 2000000

build_flags =
    -DHAL_SAI_MODULE_ENABLED
    ; CMSIS-DSP (vendored in lib/CMSIS-DSP) 헤더 경로 — 프로젝트/라이브러리 양쪽 노출
    -I lib/CMSIS-DSP/Include
    -I lib/CMSIS-DSP/PrivateInclude